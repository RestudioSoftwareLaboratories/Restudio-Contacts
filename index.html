<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restudio Contacts</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/JzYGnt17/restudio-profile.png">
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com;
        style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com;
        font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
        img-src 'self' https://i.postimg.cc data: https://*.openstreetmap.org https://*.tile.openstreetmap.org;
        connect-src 'self' https://tile.openstreetmap.org;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.13.0/dist/tabler-icons.min.css">
    <!-- Tiny5 Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <!-- Ubuntu Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@100;400;700&display=swap" rel="stylesheet">
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <img class="logo-img" src="https://i.postimg.cc/90CzkZm3/swrh-restudio.png" alt="Restudio Logo" onerror="this.style.display='none'">
        <span class="logo-text">contacts</span>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar">
            <span class="sidebar-label"><i class="ti ti-menu-2"></i> Menu</span>
            <button class="btn-sidebar btn-create active" id="btnCreateContact" onclick="showCreateForm()">
                <i class="ti ti-plus"></i> Create a new contact
            </button>
            <hr class="divider">
            <button class="btn-sidebar" id="btnContacts" onclick="showContactsList()">
                <i class="ti ti-address-book"></i> Contacts
                <span class="contact-count-badge" id="contactCountBadge">0</span>
            </button>
            <button class="btn-sidebar" id="btnGroups" onclick="showGroupsView()">
                <i class="ti ti-users"></i> Groups
            </button>
            <button class="btn-sidebar" id="btnStats" onclick="showStats()">
                <i class="ti ti-chart-bar"></i> Statistics
            </button>
            <hr class="divider">
            <button class="btn-sidebar btn-danger-sidebar" id="btnClearData" onclick="clearAllData()">
                <i class="ti ti-trash"></i> Clear All Data
            </button>
        </aside>
        <main class="content-area" id="contentArea"></main>
    </div>

    <div id="modalContainer"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="script.js"></script>
</body>
</html>
